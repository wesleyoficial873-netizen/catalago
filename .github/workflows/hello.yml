name: hello-check
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check environment
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "$ANDROID_HOME" 2>&1 || true
            echo "--platforms--"
            ls "$ANDROID_HOME/platforms" 2>&1 || true
            echo "--build-tools--"
            ls "$ANDROID_HOME/build-tools" 2>&1 || true
            echo "--java--"
            java -version 2>&1
            which java
            echo "JAVA_HOME=$JAVA_HOME"
            ls /usr/lib/jvm 2>&1 || true
            echo "--gradle--"
            gradle -v 2>&1 || echo "no system gradle"
          } > ci-log.txt 2>&1
          cat ci-log.txt
      - name: push log to ci-logs branch
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git checkout -B ci-logs
          git add -f ci-log.txt
          git commit -m "ci log $(date)" -q
          git push -f origin ci-logs
