name: hello-check
on: [workflow_dispatch, push]
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: check internet
        run: |
          {
            echo "### Internet check"
            echo '```'
            curl -sI --max-time 10 https://dl.google.com | head -3 || echo "dl.google.com FAIL"
            curl -sI --max-time 10 https://repo.maven.apache.org | head -3 || echo "maven FAIL"
            curl -sI --max-time 10 https://services.gradle.org | head -3 || echo "gradle FAIL"
            java -version 2>&1
            which java
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
