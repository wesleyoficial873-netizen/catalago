name: hello-check
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: check environment
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "$ANDROID_HOME" 2>&1 || true
            echo "--platforms--"
            ls "$ANDROID_HOME/platforms" 2>&1 || true
            echo "--build-tools--"
            ls "$ANDROID_HOME/build-tools" 2>&1 || true
            echo "--java--"
            java -version 2>&1
            which java
            echo "JAVA_HOME=$JAVA_HOME"
            ls /usr/lib/jvm 2>&1 || true
            echo "--gradle--"
            gradle -v 2>&1 || echo "no system gradle"
          } > /tmp/envcheck.txt 2>&1
          cat /tmp/envcheck.txt
      - name: test release upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-env-${{ github.run_id }}
          files: /tmp/envcheck.txt
          body: "env check"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
