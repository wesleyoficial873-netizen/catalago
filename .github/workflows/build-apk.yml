name: Build APK

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Validate APK (aapt badging + sizes)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          {
            echo "Tamanho do APK:"
            ls -la "$APK"
            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
            echo "Usando aapt: $AAPT"
            "$AAPT" dump badging "$APK"
          } | tee /tmp/apk-validate.txt


      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: apk-validation-log
          path: /tmp/apk-validate.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voz-clone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Voz Clone APK (build ${{ github.run_number }})
          body: |
            APK gerado automaticamente pelo GitHub Actions a partir do commit
            ${{ github.sha }}.

            Baixe o arquivo `app-debug.apk` abaixo e instale no seu Android
            (pode ser preciso permitir "instalar de fontes desconhecidas").
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            /tmp/apk-validate.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
